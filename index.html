<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальное служение</title>

<style>

body{
    margin:0;
    padding:40px;
    background:#f2f0eb;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:60px;
}

.folders{
    max-width:900px;
    margin:auto;
}

.folder-link{
    text-decoration:none;
}

.folder{
    width:420px;
    height:120px;
    background:#e8ddd1;
    border-radius:12px;
    margin-bottom:-35px;
    position:relative;
    transition:all .25s ease;
}

.folder:nth-child(1){
    margin-left:0;
}

.folder-link:nth-child(2) .folder{
    background:#f0d6d6;
    margin-left:150px;
}

.folder-link:nth-child(3) .folder{
    background:#dcd6cf;
}

.folder-link:nth-child(4) .folder{
    background:#f2d3b3;
    margin-left:120px;
}

.folder-link:nth-child(5) .folder{
    background:#d9e2ef;
}

.folder-tab{
    position:absolute;
    top:-28px;
    left:40px;
    width:180px;
    height:45px;
    background:inherit;
    border-radius:10px 10px 0 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:22px;
    color:black;
}

.folder:hover{
    transform:translateY(-15px);
}

</style>

</head>
<body>

<h1>Музыкальное служение</h1>

<div class="folders">

<a class="folder-link" href="about.html">
    <div class="folder">
        <div class="folder-tab">О НАС</div>
    </div>
</a>

<a class="folder-link" href="church.html">
    <div class="folder">
        <div class="folder-tab">ЦЕРКОВЬ</div>
    </div>
</a>

<a class="folder-link" href="services.html">
    <div class="folder">
        <div class="folder-tab">СЛУЖЕНИЯ</div>
    </div>
</a>

<a class="folder-link" href="songs.html">
    <div class="folder">
        <div class="folder-tab">АРХИВ ПЕСЕН</div>
    </div>
</a>

<a class="folder-link" href="social.html">
    <div class="folder">
        <div class="folder-tab">СОЦСЕТИ</div>
    </div>
</a>

</div>

</body>
</html>
